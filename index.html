<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="img/4_enemie_boss_chicken/3_attack/G18.png">
</head>
<body>

    <h1>El Pollo Loco</h1>

    <!-- Start Screen -->
    <div id="start_screen" class="start-screen">
        <button id="start-btn" class="btn" onclick="startGame()">Start Game</button>
            <div class="game-description">
                <div class="game-controls">
                    <h2>Game Controls</h2>
                    <ul>
                        <li>Move Left: A</li>
                        <li>Move Right: D</li>
                        <li>Jump: W</li>
                        <li>Throw Bottle: Space</li>
                    </ul>   
                </div>
                <div class="game-rules">
                    <h2>Game Rules</h2>
                    <ul>
                        <li>Rule 1: Do not let the chickens escape!</li>
                        <li>Rule 2: Collect all the coins!</li>
                        <li>Rule 3: Use your bottles wisely!</li>
                    </ul>
                </div>
            </div>
    </div>

   <div id="end_screen" class="end-screen" style="display: none;">
    <h1 id="win_message" style="display: none;">You Win!</h1>
    <h1 id="lose_message" style="display: none;">You Lose!</h1>
</div>

   

    <div id="game_container" style="display: none;">
        <canvas id="canvas" width="720" height="480"></canvas>
    </div>
   

    <script src="classes/drawable-objects.class.js"></script>
    <script src="classes/moveable-object.class.js"></script>
    <script src="classes/character.class.js"></script>
    <script src="classes/chicken.class.js"></script>
    <script src="classes/chicken-small.class.js"></script>
    <script src="classes/cloud.class.js"></script>
    <script src="classes/background-objects.class.js"></script>
    <script src="classes/health-status-bar.class.js"></script>
    <script src="classes/bottles-status-bar.class.js"></script>
    <script src="classes/coin-status-bar.class.js"></script>
    <script src="classes/boss-status-bar.class.js"></script>
    <script src="classes/collectable-objects.class.js"></script>
    <script src="classes/throwable-object.class.js"></script>
    <script src="classes/world.class.js"></script>
    <script src="classes/keyboard.class.js"></script>
    <script src="classes/mobile-controls.class.js"></script>
    <script src="classes/level.class.js"></script>
    <script src="classes/endboss.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>

</body>
</html>
